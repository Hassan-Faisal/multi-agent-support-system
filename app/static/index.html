<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nimbus Support Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f4f2ee; --panel: #fbfaf8; --ink: #1d1c1a; --muted: #6f6b64; --line: #e3dfd8;
  --accent: #2f4b3a; --user: #1d1c1a; --user-ink: #f4f2ee;
  --billing: #b7791f; --technical: #2b6cb0; --orders: #2f855a; --escalation: #c53030; --triage: #6f6b64;
  --mono: "IBM Plex Mono", ui-monospace, monospace;
  --sans: "IBM Plex Sans", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #161615; --panel: #1e1e1c; --ink: #ebe8e2; --muted: #9a958c; --line: #2e2d2a;
          --accent: #8fbf9f; --user: #ebe8e2; --user-ink: #161615;
          --billing: #e0a84a; --technical: #6ea8e8; --orders: #6cc08f; --escalation: #f07a7a; }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--sans); }
.app { display: grid; grid-template-columns: 280px 1fr 320px; height: 100vh; }
aside, .trace { background: var(--panel); overflow-y: auto; padding: 20px; }
aside { border-right: 1px solid var(--line); }
.trace { border-left: 1px solid var(--line); }
h1 { font-size: 15px; font-weight: 600; margin: 0 0 2px; letter-spacing: -.01em; }
h2 { font: 500 11px var(--mono); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 24px 0 8px; }
.sub { color: var(--muted); font-size: 13px; }
select, button, textarea { font: inherit; color: inherit; }
select { width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); margin-top: 16px; }
.kv { display: flex; justify-content: space-between; font-size: 13px; padding: 4px 0; border-bottom: 1px dashed var(--line); gap: 8px; }
.kv span:first-child { font-family: var(--mono); font-size: 12px; }
.kv span:last-child { color: var(--muted); text-align: right; }
.pill { font: 500 11px var(--mono); padding: 1px 7px; border-radius: 99px; border: 1px solid currentColor; }
/* chat */
main { display: flex; flex-direction: column; min-width: 0; }
header.bar { display: flex; align-items: center; justify-content: space-between; padding: 14px 24px; border-bottom: 1px solid var(--line); gap: 12px; }
.now { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 8px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--triage); }
.ghost { background: none; border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; cursor: pointer; font-size: 13px; }
.ghost:hover { border-color: var(--muted); }
#log { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 18px; }
.msg { max-width: 640px; }
.msg.user { align-self: flex-end; background: var(--user); color: var(--user-ink); padding: 10px 14px; border-radius: 14px 14px 4px 14px; }
.msg.bot .who { font: 500 11px var(--mono); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 4px; display: flex; gap: 6px; align-items: center; }
.msg.bot .body { border-left: 2px solid currentColor; padding-left: 12px; color: var(--ink); }
.msg.bot .body p { margin: 0 0 8px; } .msg.bot .body p:last-child { margin: 0; }
.msg.bot .body ul, .msg.bot .body ol { margin: 4px 0 8px; padding-left: 20px; }
.msg.err .body { color: var(--escalation); }
.typing { color: var(--muted); font-size: 13px; font-family: var(--mono); }
.empty { margin: auto; text-align: center; max-width: 420px; color: var(--muted); }
.empty h3 { color: var(--ink); font-weight: 600; margin: 0 0 6px; font-size: 18px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 16px; }
.chip { border: 1px solid var(--line); background: var(--panel); border-radius: 99px; padding: 6px 12px; font-size: 13px; cursor: pointer; }
.chip:hover { border-color: var(--accent); color: var(--accent); }
form { display: flex; gap: 10px; padding: 16px 24px 20px; border-top: 1px solid var(--line); }
textarea { flex: 1; resize: none; border: 1px solid var(--line); background: var(--panel); border-radius: 12px; padding: 10px 14px; height: 46px; max-height: 160px; outline: none; }
textarea:focus { border-color: var(--accent); }
.send { background: var(--accent); color: var(--bg); border: 0; border-radius: 12px; padding: 0 18px; cursor: pointer; font-weight: 500; }
.send:disabled { opacity: .5; cursor: default; }
/* trace */
.turn { border-top: 1px solid var(--line); padding: 12px 0; }
.turn:first-of-type { border-top: 0; }
.turn .q { font-size: 13px; margin-bottom: 8px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ev { font: 12px/1.45 var(--mono); padding: 3px 0 3px 12px; border-left: 2px solid var(--line); color: var(--muted); word-break: break-word; }
.ev b { font-weight: 500; }
.legend { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.c-billing { color: var(--billing); } .c-technical { color: var(--technical); } .c-orders { color: var(--orders); }
.c-escalation { color: var(--escalation); } .c-triage, .c-assistant { color: var(--triage); }
.bg-billing { background: var(--billing); } .bg-technical { background: var(--technical); } .bg-orders { background: var(--orders); }
.bg-escalation { background: var(--escalation); } .bg-triage { background: var(--triage); }
.toggle-trace { display: none; }
@media (max-width: 1100px) { .app { grid-template-columns: 1fr 320px; } aside { display: none; } }
@media (max-width: 760px) {
  .app { grid-template-columns: 1fr; }
  .trace { display: none; position: fixed; inset: 0; z-index: 5; }
  .trace.open { display: block; }
  .toggle-trace { display: inline-block; }
  header.bar, #log, form { padding-left: 16px; padding-right: 16px; }
}
</style>
</head>
<body>
<div class="app">
  <aside>
    <h1>Nimbus Support</h1>
    <div class="sub">Multi-agent console · demo data</div>
    <select id="customer" aria-label="Signed-in customer"></select>
    <div id="account"></div>
  </aside>

  <main>
    <header class="bar">
      <div class="now"><span class="dot" id="nowDot"></span><span id="nowText">Front desk (triage)</span></div>
      <div>
        <button class="ghost toggle-trace" id="openTrace">Trace</button>
        <button class="ghost" id="newChat">New conversation</button>
      </div>
    </header>
    <div id="log"></div>
    <form id="form">
      <textarea id="input" placeholder="Describe your issue…" rows="1"></textarea>
      <button class="send" id="send" type="submit">Send</button>
    </form>
  </main>

  <section class="trace" id="trace">
    <h1>Agent trace</h1>
    <div class="sub">Routing, handoffs and tool calls per turn</div>
    <div class="legend">
      <span class="pill c-billing">billing</span><span class="pill c-technical">technical</span>
      <span class="pill c-orders">orders</span><span class="pill c-escalation">escalation</span>
    </div>
    <button class="ghost toggle-trace" id="closeTrace" style="margin-top:12px">Close</button>
    <h2>This conversation</h2>
    <div id="turns"><div class="sub">Nothing yet.</div></div>
  </section>
</div>

<script>
const $ = s => document.querySelector(s);
const LABEL = { billing: "Billing", technical: "Technical support", orders: "Orders & shipping",
                escalation: "Escalation", triage: "Front desk", assistant: "Assistant" };
const SUGGEST = {
  C001: ["I was charged twice this month", "Where is my headphones order?", "My app crashes when I open it"],
  C002: ["I want to return my desk lamp", "Why is my invoice overdue?", "I get a 403 from the API"],
  C003: ["My standing desk is late again, this is unacceptable", "Refund my last invoice", "I lost my 2FA phone"],
};
let session = crypto.randomUUID(), busy = false;

const esc = s => s.replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function md(text) {  // tiny, safe markdown: paragraphs, lists, **bold**, `code`
  const inline = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/`(.+?)`/g, "<code>$1</code>");
  return text.trim().split(/\n{2,}/).map(block => {
    const lines = block.split("\n");
    if (lines.every(l => /^\s*[-*]\s+/.test(l))) return "<ul>" + lines.map(l => `<li>${inline(l.replace(/^\s*[-*]\s+/, ""))}</li>`).join("") + "</ul>";
    if (lines.every(l => /^\s*\d+[.)]\s+/.test(l))) return "<ol>" + lines.map(l => `<li>${inline(l.replace(/^\s*\d+[.)]\s+/, ""))}</li>`).join("") + "</ol>";
    return `<p>${lines.map(inline).join("<br>")}</p>`;
  }).join("");
}

async function api(path, opts) {
  const r = await fetch(path, opts);
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.detail || r.statusText);
  return data;
}

async function loadCustomers() {
  const list = await api("/api/customers");
  $("#customer").innerHTML = list.map(c => `<option value="${c.id}">${esc(c.name)} · ${c.plan}</option>`).join("");
  await loadAccount();
}

async function loadAccount() {
  const c = await api(`/api/customers/${$("#customer").value}`);
  const row = (a, b) => `<div class="kv"><span>${esc(a)}</span><span>${esc(String(b))}</span></div>`;
  $("#account").innerHTML =
    `<h2>Signed in as</h2>${row(c.id, c.email)}${row("plan", c.plan)}` +
    `<h2>Orders</h2>${c.orders.map(o => row(o.id, `${o.status} · $${o.total}${o.return ? " · return " + o.return.replace("_", " ") : ""}`)).join("")}` +
    `<h2>Invoices</h2>${c.invoices.map(i => row(i.id, `${i.status} · $${i.amount}${i.refund ? " · refund " + i.refund.replace("_", " ") : ""}`)).join("")}` +
    `<h2>Tickets</h2>${c.tickets.length ? c.tickets.map(t => row(t.id, `${t.priority} · ${t.status}`)).join("") : '<div class="sub">None</div>'}`;
}

function setActive(agent) {
  const a = agent || "triage";
  $("#nowDot").className = `dot bg-${a}`;
  $("#nowText").textContent = agent ? `Talking to: ${LABEL[a]}` : "Front desk (triage)";
}

function showEmpty() {
  const chips = (SUGGEST[$("#customer").value] || []).map(s => `<button class="chip">${esc(s)}</button>`).join("");
  $("#log").innerHTML = `<div class="empty"><h3>How can we help?</h3>
    A front-desk agent routes you to billing, technical, orders or a human. Try one of these:
    <div class="chips">${chips}</div></div>`;
  $("#log").querySelectorAll(".chip").forEach(b => b.onclick = () => send(b.textContent));
}

function add(html, cls) {
  $(".empty")?.remove();
  const d = document.createElement("div");
  d.className = `msg ${cls}`; d.innerHTML = html;
  $("#log").appendChild(d); $("#log").scrollTop = $("#log").scrollHeight;
  return d;
}

function addTrace(question, events) {
  if ($("#turns .sub")) $("#turns").innerHTML = "";
  const lines = events.map(e => {
    if (e.type === "route") return `<div class="ev">route → <b class="c-${e.agent === "none" ? "triage" : e.agent}">${e.agent}</b><br>${esc(e.reason || "")}</div>`;
    if (e.type === "handoff") return `<div class="ev"><b class="c-${e.source}">${e.source}</b> ⇢ <b class="c-${e.target}">${e.target}</b><br>${esc(e.reason || "")}</div>`;
    if (e.type === "tool") return `<div class="ev"><b class="c-${e.agent}">${e.agent}</b> · ${esc(e.tool)}(${esc(Object.values(e.args || {}).map(v => JSON.stringify(v)).join(", "))})</div>`;
    if (e.type === "guardrail") return `<div class="ev c-escalation">⚠ ${esc(e.detail)}</div>`;
    return "";
  }).join("") || `<div class="ev">answered by current agent, no tools</div>`;
  const t = document.createElement("div");
  t.className = "turn"; t.innerHTML = `<div class="q">“${esc(question)}”</div>${lines}`;
  $("#turns").prepend(t);
}

async function send(text) {
  text = text.trim();
  if (!text || busy) return;
  busy = true; $("#send").disabled = true; $("#input").value = "";
  add(esc(text), "user");
  const typing = add('<div class="typing">agents are working…</div>', "bot");
  try {
    const r = await api("/api/chat", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ session_id: session, customer_id: $("#customer").value, message: text }) });
    typing.remove();
    add(`<div class="who c-${r.agent}"><span class="dot bg-${r.agent}"></span>${LABEL[r.agent] || r.agent}</div>
         <div class="body c-${r.agent}"><div style="color:var(--ink)">${md(r.reply)}</div></div>`, "bot");
    setActive(r.active_agent); addTrace(text, r.events);
    if (r.events.some(e => e.type === "tool")) loadAccount();
  } catch (e) {
    typing.remove();
    add(`<div class="who c-escalation">Error</div><div class="body">${esc(e.message)}</div>`, "bot err");
  } finally { busy = false; $("#send").disabled = false; $("#input").focus(); }
}

function reset() {
  session = crypto.randomUUID(); setActive(null); showEmpty();
  $("#turns").innerHTML = '<div class="sub">Nothing yet.</div>';
}

$("#form").onsubmit = e => { e.preventDefault(); send($("#input").value); };
$("#input").onkeydown = e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send($("#input").value); } };
$("#input").oninput = e => { e.target.style.height = "46px"; e.target.style.height = Math.min(e.target.scrollHeight, 160) + "px"; };
$("#newChat").onclick = reset;
$("#customer").onchange = async () => { await loadAccount(); reset(); };
$("#openTrace").onclick = () => $("#trace").classList.add("open");
$("#closeTrace").onclick = () => $("#trace").classList.remove("open");

api("/api/health").then(h => { if (!h.ok) add(`<div class="who c-escalation">Setup needed</div><div class="body">${esc(h.error || "Model not configured")}</div>`, "bot err"); });
loadCustomers().then(showEmpty);
</script>
</body>
</html>
