name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: support
          POSTGRES_PASSWORD: support
          POSTGRES_DB: support_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U support" --health-interval 3s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://support:support@localhost:5432/support_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests alembic && ruff format --check src tests alembic
      - name: Type-check
        run: mypy
      - name: Test (unit + integration on Postgres, includes migrations)
        run: pytest --cov --cov-report=term --cov-report=xml --cov-fail-under=85
      - name: Migration drift check
        env:
          SUPPORT_DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: alembic check

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  images:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with: { context: backend, push: false, cache-from: type=gha, cache-to: "type=gha,mode=max" }
      - uses: docker/build-push-action@v6
        with: { context: frontend, push: false, cache-from: type=gha, cache-to: "type=gha,mode=max" }
      - name: Single-service image (used by Render)
        uses: docker/build-push-action@v6
        with: { context: ., file: Dockerfile, push: false, cache-from: type=gha, cache-to: "type=gha,mode=max" }
