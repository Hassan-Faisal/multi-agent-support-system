[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "support"
version = "1.0.0"
description = "Multi-agent customer support system: LangGraph agents, hybrid RAG, FastAPI"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic[email]>=2.7",
  "pydantic-settings>=2.4",
  "sqlalchemy[asyncio]>=2.0.30",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "pgvector>=0.3",
  "psycopg[binary,pool]>=3.2",
  "langgraph>=1.0",
  "langgraph-checkpoint-postgres>=2.0",
  "langchain>=1.0",
  "langchain-core>=1.0",
  "langchain-anthropic>=1.0",
  "openai>=1.40",
  "structlog>=24.1",
  "prometheus-client>=0.20",
  "pyjwt>=2.8",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5",
  "httpx>=0.27",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-PyYAML",
]

[project.scripts]
support-seed = "support.db.seed:main"
support-ingest = "support.rag.ingest:main"
support-evals = "support.evals.runner:main"

[tool.hatch.build.targets.wheel]
packages = ["src/support"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "RUF", "S", "PT", "C4"]
ignore = [
  "S101",   # assert is fine in tests
  "RUF001", # unicode in prompts is intentional
  "RUF002", # "›" in docstrings mirrors the heading-path format
  "B008",   # FastAPI Depends() in defaults
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311", "PT018", "RUF012", "C408"]
"src/support/db/seed.py" = ["S105", "S106"]
"src/support/agents/prompts.py" = ["E501"]  # prompt prose

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["support"]
disallow_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pgvector.*", "asyncpg.*", "prometheus_client.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
  "integration: needs PostgreSQL with pgvector (set TEST_DATABASE_URL)",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["support"]
omit = ["src/support/evals/*"]
